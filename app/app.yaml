# Google App Engine Standard Configuration (Free Tier F1 Instance)
runtime: python312
instance_class: F1

automatic_scaling:
  min_instances: 0
  max_instances: 1
  min_idle_instances: 0
  max_idle_instances: 1

entrypoint: python run_app.py

env_variables:
  HOST: "0.0.0.0"
  PORT: "8080"
  GOOGLE_CLIENT_ID: ""
  JWT_SECRET_KEY: "fmm_sacred_bronzes_secret_2026_gcp"

handlers:
- url: /styles.css
  static_files: frontend/styles.css
  upload: frontend/styles.css

- url: /app.js
  static_files: frontend/app.js
  upload: frontend/app.js

- url: /.*
  script: auto
  secure: always
